    <script>
        // 터치 기기에서 탭한 버튼에 hover 음영이 그대로 남는 문제 방지
        // (마우스가 있는 기기에서만 hover: 스타일을 적용한다)
        tailwind.config = { future: { hoverOnlyWhenSupported: true } };
    </script>

    <style>
        /* 커스텀 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            75% { transform: translateX(10px) rotate(5deg); }
        }
        .animate-shake { animation: shake 0.5s ease-in-out; }
        
        @keyframes chomp {
            0% { transform: scaleY(1); }
            50% { transform: scaleY(0.7); }
            100% { transform: scaleY(1); }
        }
        .animate-chomp { animation: chomp 0.3s ease-in-out infinite; }
        
        @keyframes jelly {
            0%, 100% { transform: scale(1, 1); }
            25% { transform: scale(0.9, 1.1); }
            50% { transform: scale(1.1, 0.9); }
            75% { transform: scale(0.95, 1.05); }
        }
        .animate-jelly { animation: jelly 2s infinite ease-in-out; }

        @keyframes morph {
            0% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
            25% { border-radius: 50% 50% 20% 80% / 25% 80% 20% 75%; }
            50% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            75% { border-radius: 40% 60% 70% 30% / 40% 60% 30% 70%; }
            100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
        }
        .animate-morph { animation: morph 4s infinite ease-in-out; }

        @keyframes levelUpGlow {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); transform: scale(1); }
            50% { box-shadow: 0 0 50px 20px rgba(255, 255, 255, 0.9); transform: scale(1.2); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); transform: scale(1); }
        }
        .animate-levelup { animation: levelUpGlow 2s ease-in-out; }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-15px) translateX(10px); }
            50% { transform: translateY(0) translateX(20px); }
            75% { transform: translateY(15px) translateX(10px); }
        }
        .animate-float { animation: float 4s infinite ease-in-out; }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }
        .animate-pop { animation: pop 0.3s ease-out forwards; }

        /* 클리어 화면의 반짝이에 쓰이는데 정의가 없어서 돌지 않았다 */
        @keyframes spin-slow { to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 6s linear infinite; }
    </style>

                let offset = Math.floor(Math.random() * 5) - 2; 
                let fake = answer + offset;
                if (fake >= 0 && fake !== answer) {
                    options.add(fake);
                }
                attempts++;
            }
            while (options.size < 3) {
                options.add(Math.floor(Math.random() * 20));
            }
            
            const optionsArray = shuffleArray(Array.from(options)).map(String);

            return {
                prompt: prompt,
                display: `${a} ${op} ${b}`,
                answer: String(answer),
                options: optionsArray
            };
        };

        // 정답이 0인 문제("5 빼기 5")는 한 묶음에 최대 이만큼만. 예전에는 b가 a에
        // 의존해서 뽑히는 바람에 레벨 1의 31%가 "n - n = 0"이었다.
        const ZERO_ANSWER_LIMIT = 2;

        const generateMathPool = (level, count = 20) => {
            const picked = [];
            let zeros = 0;
            // 조합 전체를 섞어 앞에서부터 담으므로 한 묶음 안에 같은 문제가 없다.
            for (const [a, b] of shuffleArray(mathPairs(level))) {
                if (picked.length >= count) break;
                if (level !== 2 && a - b === 0) {
                    if (zeros >= ZERO_ANSWER_LIMIT) continue;
                    zeros++;
                }
                picked.push([a, b]);
            }
            return picked.map(([a, b], i) => ({ id: `${level}-${i}`, ...generateMathQuestion(level, a, b) }));
        };


        // --- 유틸리티 함수 ---
        const shuffleArray = (array) => {
          const newArray = [...array];
          for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
          }
          return newArray;
        };

        const shuffleOptions = (question) => {
          return {
            ...question,
            options: shuffleArray(question.options)
          };
        };


        // --- 메인 앱 컴포넌트 ---
        function WordTamagotchi() {
          const [gameState, setGameState] = useState('characterSelect'); 
          const [selectedChar, setSelectedChar] = useState('nyam'); 
          
          // 레벨별로 문제 묶음을 따로 보관한다. { 1: [...], 2: [...], 3: [...] }
          // (예전처럼 3개 레벨을 하나의 배열로 이어붙이면, 틀려서 경험치가 깎일 때마다
          //  인덱스만 계속 앞으로 나가서 결국 배열 끝을 넘어가고 게임이 멈췄다.)
          const [questionPools, setQuestionPools] = useState({ 1: [], 2: [], 3: [] });
          const [currentIdx, setCurrentIdx] = useState(0);
          const [level, setLevel] = useState(1);
          const [exp, setExp] = useState(0);
          const maxExpPerLevel = QUESTIONS_PER_LEVEL;

          const [monsterState, setMonsterState] = useState('idle');
          const [swallowedWord, setSwallowedWord] = useState('');
          const [wrongWord, setWrongWord] = useState(null);
          // 현재 문제에서 몇 번 틀렸는지 (MAX_WRONG_TRIES에 닿으면 정답 공개)
          const [wrongTries, setWrongTries] = useState(0);

          // [추가] 쩝쩝이 변신용 모양 상태
          // null = 기본 몰랑 블롭, 아니면 { shape, bg }
          const [jeopShape, setJeopShape] = useState(null);

          // alert() 대신 쓰는 화면 안 알림 (글 못 읽는 아이도 그림으로 알 수 있게)
          const [notice, setNotice] = useState(null);

          // 예약된 애니메이션 타이머들. 화면을 벗어나거나 다음 답을 고르면 모두 취소해야
          // 뒤늦게 터진 타이머가 상태를 덮어쓰지 않는다.
          const timersRef = useRef([]);
          const digestTimerRef = useRef(null);

          const later = (fn, ms) => {
            const id = setTimeout(fn, ms);
            timersRef.current.push(id);
            return id;
          };
          const clearTimers = () => {
            timersRef.current.forEach(clearTimeout);
            timersRef.current = [];
            if (digestTimerRef.current) {
              clearInterval(digestTimerRef.current);
              digestTimerRef.current = null;
            }
          };
          useEffect(() => clearTimers, []);

          // tone: 'bad' = 배탈 같은 실패 알림(빨강), 'hint' = 정답 알려주기(파랑)
          const showNotice = (emoji, text, ms = 2400, tone = 'bad') => {
            setNotice({ emoji, text, tone });
            later(() => setNotice(null), ms);
          };

          const [isMusicPlaying, setIsMusicPlaying] = useState(false);
          const [showDebug, setShowDebug] = useState(false);
          const [audioPath, setAudioPath] = useState(''); 
          const [audioLog, setAudioLog] = useState([]);
          const audioRef = useRef(null);

          // 미니게임용 상태
          const [collectedWords, setCollectedWords] = useState([]);
          const [digestBubbles, setDigestBubbles] = useState([]);
          const [timeLeft, setTimeLeft] = useState(30); // [추가] 30초 타이머

          const getStyles = () => {
              if (selectedChar === 'nyam') {
                  return {
                      bg: "bg-green-300",
                      text: "text-green-600",
                      lightBg: "bg-green-50",
                      label: "냠냠이",
                      shape: "rounded-full w-32 h-32",
                      eye: "w-4 h-4 bg-gray-800",
                      levels: [
                          { size: 'w-32 h-32', desc: '소리와 단어' },
                          { size: 'w-48 h-48', desc: '반대말' },
                          { size: 'w-64 h-64', desc: '문장 완성' }
                      ]
                  };
              } else if (selectedChar === 'nyom') {
                  return {
                      bg: "bg-cyan-400",
                      text: "text-cyan-600",
                      lightBg: "bg-cyan-50",
                      label: "뇸뇸이",
                      shape: "rounded-[3rem] w-28 h-40 animate-jelly", 
                      eye: "w-3 h-5 bg-white", 
                      levels: [
                          { size: 'w-28 h-40', desc: '한자리 빼기' },
                          { size: 'w-36 h-52', desc: '두자리 만들기 더하기' },
                          { size: 'w-48 h-64', desc: '한자리 만들기 빼기' }
                      ]
                  };
              } else { // 쩝쩝이
                  return {
                      bg: "bg-orange-400",
                      text: "text-orange-600",
                      lightBg: "bg-orange-50",
                      label: "쩝쩝이",
                      shape: `w-32 h-32 transition-all duration-500 ${jeopShapeClass(jeopShape)}`, // [수정] 변신 스타일 적용
                      eye: "w-5 h-5 bg-white rounded-full",
                      levels: [
                          { size: 'w-32 h-32', desc: '모양과 색깔' },
                          { size: 'w-40 h-40', desc: '기초 패턴 (2~3개)' },
                          { size: 'w-48 h-48', desc: '심화 패턴 (4개)' }
                      ]
                  };
              }
          };
          const currentStyle = getStyles();
          const currentPool = questionPools[level] || [];

          const addLog = (msg) => {
             const time = new Date().toLocaleTimeString();
             setAudioLog(prev => [`[${time}] ${msg}`, ...prev].slice(0, 5));
          };

          useEffect(() => {
            const audio = new Audio();
            audioRef.current = audio;
            audio.loop = true;
            audio.volume = 0.3;
            
            const handleCanPlay = () => addLog("오디오 준비 완료");
            const handleError = (e) => {
                let errorMsg = "알 수 없는 에러";
                if (audio.error) errorMsg = `Code: ${audio.error.code}`;
                addLog(`에러 발생: ${errorMsg}`);
                setIsMusicPlaying(false);
            };
            const handlePlay = () => { setIsMusicPlaying(true); };
            const handlePause = () => { setIsMusicPlaying(false); };

            audio.addEventListener('canplay', handleCanPlay);
            audio.addEventListener('error', handleError);
            audio.addEventListener('play', handlePlay);
            audio.addEventListener('pause', handlePause);

            return () => {
                audio.removeEventListener('canplay', handleCanPlay);
                audio.removeEventListener('error', handleError);
                audio.removeEventListener('play', handlePlay);
                audio.removeEventListener('pause', handlePause);
                audio.pause();
                audioRef.current = null;
            };
          }, []);

          useEffect(() => {
              if(audioRef.current && audioPath) {
                  addLog(`경로 설정: ${audioPath}`);
                  const currentSrc = audioRef.current.getAttribute('src');
                  if (currentSrc !== audioPath) {
                      audioRef.current.src = audioPath;
                      const playPromise = audioRef.current.play();
                      if (playPromise !== undefined) {
                          playPromise.catch(e => {
                              addLog(`자동 재생 실패: ${e.name}`);
                              setIsMusicPlaying(false);
                          });
                      }
                  }
              }
          }, [audioPath]);

          // [추가] 타이머 로직
          useEffect(() => {
              if (gameState !== 'digesting') return;
              setTimeLeft(30);
              const timerId = setInterval(() => {
                  // 부수효과를 updater 안에서 실행하면 안 되므로 남은 시간만 줄이고,
                  // 0이 되는 처리는 아래 별도 effect에서 한다.
                  setTimeLeft((prev) => (prev <= 0 ? 0 : prev - 1));
              }, 1000);
              digestTimerRef.current = timerId;
              return () => {
                  clearInterval(timerId);
                  if (digestTimerRef.current === timerId) digestTimerRef.current = null;
              };
          }, [gameState]);

          useEffect(() => {
              if (gameState === 'digesting' && timeLeft === 0) handleDigestFail();
          }, [gameState, timeLeft]);

          const handleDigestFail = () => {
              clearTimers();
              setDigestBubbles([]);
              setTimeLeft(30);
              setExp(0);
              setCollectedWords([]);
              setMonsterState('idle');
              setSwallowedWord('');
              setWrongWord(null);
              setWrongTries(0);
              setGameState('playing');
              // 레벨 초기화는 아님, 해당 레벨 경험치만 초기화
              // alert()는 화면을 막아버리는 데다 글 못 읽는 아이에겐 의미가 없어서
              // 그림이 있는 화면 안 알림으로 바꿨다.
              showNotice('🤢', '배탈이 났어요!\n처음부터 다시 해볼까요?');
              speakWord("아이고, 배탈이 났어요! 처음부터 다시 해볼까요?");
          };

          // 한 판을 처음 상태로 되돌린다. 예약된 타이머까지 반드시 함께 취소해야
          // 이전 판의 애니메이션 콜백이 새 판의 상태를 덮어쓰지 않는다.
          const resetPlayState = () => {
              clearTimers();
              setNotice(null);
              setCurrentIdx(0);
              setExp(0);
              setMonsterState('idle');
              setSwallowedWord('');
              setWrongWord(null);
              setWrongTries(0);
              setCollectedWords([]);
              setDigestBubbles([]);
              setTimeLeft(30);
              setJeopShape(null);
          };

          const resetLevel = () => {
              // 현재 레벨을 처음부터 다시 시작 (문제 재설정, 경험치 0)
              setQuestionPools(prepareGameData(selectedChar));
              resetPlayState();
              setGameState('playing'); // 혹시 다른 상태였으면 playing으로
              speakWord("다시 시작해볼까요?");
          };

          // 놀이 화면에서 빠져나갈 때 (홈/캐릭터 변경) 남은 타이머를 정리한다.
          const leaveTo = (state) => {
              clearTimers();
              setNotice(null);
              setMonsterState('idle');
              setSwallowedWord('');
              setWrongWord(null);
              setWrongTries(0);
              // 메뉴 화면에는 clip-path 인라인 스타일이 붙지 않으므로, 변신한 모양을
              // 그대로 들고 나가면 쩝쩝이가 밋밋한 네모로 보인다. 기본 모양으로 되돌린다.
              setJeopShape(null);
              setGameState(state);
          };

          const toggleMusic = () => {
            if (!audioRef.current) return;
            if (isMusicPlaying) {
              audioRef.current.pause();
            } else {
              if (!audioPath) {
                  let defaultPath = 'public/music/bgm1.mp3';
                  if (selectedChar === 'nyom') defaultPath = 'public/music/bgm2.mp3';
                  if (selectedChar === 'jeop') defaultPath = 'public/music/bgm3.mp3';
                  // 경로가 바뀌면 아래 useEffect([audioPath])가 알아서 재생한다.
                  // 여기서 또 play()를 걸면 두 번 재생 요청이 겹쳐 한쪽이 실패한다.
                  setAudioPath(defaultPath);
              } else {
                  audioRef.current.play().catch(e => {
                      addLog(`재생 실패: ${e.name}`);
                  });
              }
            }
          };

          const changePath = (newPath) => setAudioPath(newPath);

          // 한 레벨분 문제 묶음을 새로 뽑는다.
          const freshPool = (char, lv) => {
            if (char === 'nyom') return generateMathPool(lv, POOL_SIZE);
            const src = char === 'nyam' ? WORD_DATA : JEOP_DATA;
            return shuffleArray(src[`level${lv}`]).slice(0, POOL_SIZE).map(shuffleOptions);
          };

          // 레벨별 문제 묶음을 { 1: [...], 2: [...], 3: [...] } 형태로 만든다.
          // 시작 레벨과 무관하게 세 레벨을 모두 준비해두고, 화면에는 현재 레벨 것만 쓴다.
          const prepareGameData = (char) => ({
            1: freshPool(char, 1), 2: freshPool(char, 2), 3: freshPool(char, 3)
          });

          const speakWord = useCallback((text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = 'ko-KR';
              utterance.rate = 0.85; 
              utterance.pitch = level === 1 ? 1.4 : (level === 2 ? 1.1 : 0.9);
              window.speechSynthesis.speak(utterance);
            }
          }, [level]);

          const playSound = useCallback((type) => {
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator();
              const gainNode = ctx.createGain();
              osc.connect(gainNode);
              gainNode.connect(ctx.destination);
              
              const now = ctx.currentTime;
              if (type === 'eat') {
                if (selectedChar === 'jeop') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.15);
                    gainNode.gain.setValueAtTime(0.3, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gainNode.gain.setValueAtTime(0.2, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                }
              } else if (type === 'happy') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
              } else if (type === 'levelup') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554, now + 0.1);
                osc.frequency.setValueAtTime(659, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
              } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
              }
            } catch (e) { console.log("Audio API issue"); }
          }, [selectedChar]);

          const selectCharacter = (char) => {
              clearTimers();
              setSelectedChar(char);
              setGameState('menu');
              let bgmFile = 'bgm1.mp3';
              if (char === 'nyom') bgmFile = 'bgm2.mp3';
              if (char === 'jeop') bgmFile = 'bgm3.mp3';

              // [추가] 쩝쩝이 초기 모양 설정
              setJeopShape(null);

              const newPath = `public/music/${bgmFile}`;
              setAudioPath(newPath);
              if (audioRef.current) {
                  audioRef.current.src = newPath;
                  audioRef.current.play()
                      .then(() => setIsMusicPlaying(true))
                      .catch(e => {
                          console.log("Auto-play blocked or file missing:", e);
                          addLog(`자동 재생 실패: ${e.name}`);
                      });
              }
          };

          const startGame = (startLevel) => {
            setQuestionPools(prepareGameData(selectedChar));
            setLevel(startLevel);
            resetPlayState();
            setGameState('playing');
          };

          const handleFeed = (selectedOption) => {
            if (monsterState !== 'idle' && monsterState !== 'sad') return;

            const currentData = currentPool[currentIdx];
            if (!currentData) return;

            // 직전 오답의 '800ms 뒤 idle 복귀' 같은 예약 타이머를 먼저 없앤다.
            // 안 그러면 그 타이머가 먹는 도중에 끼어들어 버튼을 다시 열어버리고,
            // 한 문제에 두 번 답이 들어가 경험치와 문제 번호가 어긋난다.
            clearTimers();

            speakWord(selectedOption);

            if (selectedOption === currentData.answer) {
              setMonsterState('eating');
              setSwallowedWord(selectedOption);
              setWrongTries(0);
              playSound('eat');
              
              // 아래 예약 콜백에서 쓰려면 지금 만든 배열을 그대로 넘겨야 한다.
              // (setState 후 옛 클로저의 collectedWords를 읽으면 마지막 단어가 빠진다)
              const newWords = [...collectedWords, selectedOption];
              setCollectedWords(newWords);
              
              // [추가] 쩝쩝이 레벨 1 변신 로직
              // 표에 없는 정답(문자열 보기 등)은 기본 몰랑 블롭으로 되돌린다.
              if (selectedChar === 'jeop' && level === 1) {
                  setJeopShape(JEOP_SHAPES[selectedOption] || null);
              }

              later(() => {
                setMonsterState('happy');
                playSound('happy');
                setSwallowedWord('');

                const newExp = exp + 1;
                setExp(newExp);

                later(() => {
                  if (newExp >= maxExpPerLevel) {
                    // 모든 캐릭터 소화시키기 게임으로 통일
                    startDigestion(newWords);
                  } else {
                    nextQuestion();
                  }
                }, 1500);
              }, 600);

            } else {
              setMonsterState('sad');
              setWrongWord(selectedOption);

              // 오답 감점을 없앴다. 예전에는 틀릴 때마다 exp가 -1이었는데,
              // 한 문제를 맞히기까지 평균 2번 틀리므로 순 -1이 되어 경험치가
              // 오히려 줄었다. 첫 시도 정답률 40%면 한 레벨에 811탭, 30%면
              // 8500탭이 필요해서 사실상 진행이 멈춘 것처럼 보였다.
              const tries = wrongTries + 1;
              setWrongTries(tries);

              if (tries >= MAX_WRONG_TRIES) {
                // 같은 문제에 계속 갇히지 않도록 정답을 알려주고 넘어간다.
                // (경험치는 주지 않는다)
                const shownAnswer = currentData.answer;
                later(() => {
                  setMonsterState('idle');
                  setWrongWord(null);
                  setWrongTries(0);
                  showNotice('💡', `정답은 "${shownAnswer}"예요!`, 2200, 'hint');
                  speakWord(`정답은 ${shownAnswer}. 다음 문제 해볼까요?`);
                  nextQuestion();
                }, 900);
              } else {
                later(() => {
                  setMonsterState('idle');
                  setWrongWord(null);
                }, 800);
              }
            }
          };

          const startDigestion = (words = collectedWords) => {
              // 방울이 하나도 없으면 터뜨릴 게 없어 30초를 그냥 날리게 되므로 바로 넘어간다.
              if (!words.length) { finishLevelUp(); return; }

              // 한 레벨은 QUESTIONS_PER_LEVEL문제이므로 방울도 그만큼만 띄운다.
              // (틀릴수록 먹은 단어가 계속 쌓여서 20개 넘는 방울이 30초 안에 못 터뜨릴 만큼
              //  겹쳐 나왔고, 그러면 무조건 배탈 -> 다시 배탈이 반복됐다)
              const picked = words.slice(-QUESTIONS_PER_LEVEL);

              // 3열 격자에 하나씩 배치하고 칸 안에서만 조금씩 흔든다. 완전 무작위로 놓으면
              // 방울끼리 포개져서 아래 깔린 방울은 아예 누를 수 없었다.
              const cells = shuffleArray(
                  Array.from({ length: 12 }, (_, i) => ({ col: i % 3, row: Math.floor(i / 3) }))
              );

              const newBubbles = picked.map((word, i) => {
                  const cell = cells[i % cells.length];
                  return {
                      id: i,
                      word: word,
                      x: cell.col * 28 + Math.random() * 4,
                      y: cell.row * 22 + 4 + Math.random() * 3,
                      size: Math.random() * 20 + 64,
                      speed: Math.random() * 2 + 3 + 's',
                      delay: Math.random() * 2 + 's'
                  };
              });

              setDigestBubbles(newBubbles);
              setTimeLeft(30); // 이전 판에서 0으로 끝났을 수 있으므로 먼저 되돌려 둔다
              setGameState('digesting');
              speakWord("배가 너무 불러요! 방울을 터트려서 소화시켜주세요!");
          };

          const handlePopBubble = (id) => {
              playSound('pop');
              const remaining = digestBubbles.filter(b => b.id !== id);
              setDigestBubbles(remaining);
              if (remaining.length === 0) {
                  // 마지막 방울을 터뜨린 순간 제한시간 타이머를 즉시 멈춘다.
                  // (0.5초 뒤 레벨업이 뜨기 전에 시간이 다 되면 배탈 처리가 겹쳐 터진다)
                  if (digestTimerRef.current) {
                      clearInterval(digestTimerRef.current);
                      digestTimerRef.current = null;
                  }
                  later(finishLevelUp, 500);
              }
          };

          const finishLevelUp = () => {
            if (level === 3) {
              setGameState('clear');
              speakWord(`축하해요! ${currentStyle.label}가 왕관을 썼어요!`);
              return;
            }
            
            setMonsterState('levelup');
            setGameState('playing');
            playSound('levelup');
            speakWord(`${currentStyle.label}가 쑥쑥 자랐어요!`);

            later(() => {
              setLevel(prev => prev + 1);
              setExp(0);
              setCollectedWords([]);
              setDigestBubbles([]);
              setTimeLeft(30);
              setMonsterState('idle');
              setWrongWord(null);
              setWrongTries(0);
              setSwallowedWord('');
              // 새 레벨은 자기 문제 묶음의 첫 문제부터 시작한다.
              setCurrentIdx(0);
              // 레벨 1에서 변신한 모양은 해당 레벨 전용이므로 기본 모양으로 되돌린다.
              setJeopShape(null);
            }, 2500);
          };

          const nextQuestion = () => {
            // 예전에는 묶음 끝에서 아무것도 하지 않아 monsterState가 'happy'에 멈춘 채
            // 보기 버튼이 영영 비활성으로 남았다 (= 게임이 멈추는 증상).
            const poolSize = currentPool.length;
            if (!poolSize) return;
            if (currentIdx + 1 >= poolSize) {
              // 묶음을 다 썼으면 같은 레벨에서 새로 뽑아 섞는다.
              // 그냥 0으로 되돌리면 똑같은 문제가 똑같은 순서로 다시 나온다.
              setQuestionPools((prev) => ({ ...prev, [level]: freshPool(selectedChar, level) }));
              setCurrentIdx(0);
            } else {
              setCurrentIdx(currentIdx + 1);
            }
            setMonsterState('idle');
            setWrongTries(0); // 새 문제니까 시도 횟수도 초기화
          };

          // 음악/디버그 버튼. 놀이 화면에서는 헤더 안에 같이 넣고, 나머지 화면에서는
          // 오른쪽 위에 띄운다. (놀이 화면에서 띄우면 헤더의 홈·다시하기 버튼을 정확히
          // 덮어버려서 휴대폰에서는 홈 버튼을 아예 누를 수 없었다)
          const renderAudioButtons = (size = 24) => (
             <>
                <button onClick={toggleMusic} className={`p-2 md:p-3 rounded-full shadow-md transition-all flex-shrink-0 ${isMusicPlaying ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400 hover:bg-gray-200'}`}>
                  {isMusicPlaying ? <Music size={size} /> : <Music2 size={size} />}
                </button>
                <button onClick={() => setShowDebug(!showDebug)} className={`p-2 md:p-3 rounded-full shadow-md transition-all flex-shrink-0 ${showDebug ? 'bg-blue-100 text-blue-600' : 'bg-gray-100 text-gray-400 hover:bg-gray-200'}`}>
                  <Wrench size={size} />
                </button>
             </>
          );

          const renderDebugPanel = () => (
             <>
                {showDebug && (
                    <div className="absolute bottom-4 right-4 bg-black/80 text-white p-4 rounded-xl text-xs z-50 w-64 shadow-2xl backdrop-blur-sm">
                        <div className="mb-2 text-yellow-400 font-bold">🔧 디버그</div>
                        <div>Status: {isMusicPlaying ? "Playing" : "Stopped"}</div>
                        <div className="break-all text-blue-300">{audioPath}</div>
                        <div className="flex flex-wrap gap-1 mt-2">
                             <button onClick={() => changePath('public/music/bgm1.mp3')} className="bg-gray-700 px-2 py-1 rounded">bgm1</button>
                             <button onClick={() => changePath('public/music/bgm2.mp3')} className="bg-gray-700 px-2 py-1 rounded">bgm2</button>
                             <button onClick={() => changePath('public/music/bgm3.mp3')} className="bg-gray-700 px-2 py-1 rounded">bgm3</button>
                        </div>
                        <div className="mt-2 border-t pt-2 max-h-24 overflow-y-auto font-mono text-gray-400">
                            {audioLog.map((l,i) => <div key={i}>{l}</div>)}
                        </div>
                    </div>
                )}
             </>
          );

          const renderOverlayControls = () => (
             <>
                <div className="absolute top-4 right-4 md:top-6 md:right-6 flex gap-2 z-50">
                    {renderAudioButtons()}
                </div>
                {renderDebugPanel()}
             </>
          );

          if (gameState === 'characterSelect') {
              return (
                  <div className="flex flex-col items-center justify-center h-full w-full max-w-4xl mx-auto p-6 relative">
                      {renderOverlayControls()}
                      <h1 className="text-3xl md:text-5xl font-extrabold text-gray-800 mb-8 tracking-tight text-center">누구를 키워볼까요?</h1>
                      
                      <div className="flex flex-col md:flex-row gap-6 w-full justify-center items-stretch">
                          <button onClick={() => selectCharacter('nyam')} className="flex-1 bg-white p-6 rounded-3xl shadow-xl border-4 border-green-200 hover:border-green-400 hover:scale-105 transition-all flex flex-col items-center group">
                              <div className="w-24 h-24 bg-green-300 rounded-full flex flex-col items-center justify-center mb-4 group-hover:animate-bounce">
                                  <div className="flex space-x-3 mb-2"><div className="w-4 h-4 bg-gray-800 rounded-full"></div><div className="w-4 h-4 bg-gray-800 rounded-full"></div></div>
                                  <div className="w-10 h-4 bg-gray-800 rounded-b-full"></div>
                              </div>
                              <h2 className="text-xl font-bold text-green-600">냠냠이</h2>
                              <p className="text-sm text-gray-500">한글 놀이</p>
                          </button>

                          <button onClick={() => selectCharacter('nyom')} className="flex-1 bg-white p-6 rounded-3xl shadow-xl border-4 border-cyan-200 hover:border-cyan-400 hover:scale-105 transition-all flex flex-col items-center group">
                              <div className="w-20 h-28 bg-cyan-400 rounded-[3rem] flex flex-col items-center justify-center mb-4 group-hover:animate-jelly">
                                  <div className="flex space-x-4 mb-3"><div className="w-3 h-5 bg-white rounded-full"></div><div className="w-3 h-5 bg-white rounded-full"></div></div>
                                  <div className="w-8 h-2 bg-white/50 rounded-full"></div>
                              </div>
                              <h2 className="text-xl font-bold text-cyan-600">뇸뇸이</h2>
                              <p className="text-sm text-gray-500">수학 놀이</p>
                          </button>

                          <button onClick={() => selectCharacter('jeop')} className="flex-1 bg-white p-6 rounded-3xl shadow-xl border-4 border-orange-200 hover:border-orange-400 hover:scale-105 transition-all flex flex-col items-center group">
                              <div className="w-24 h-24 bg-orange-400 animate-morph flex flex-col items-center justify-center mb-4 shadow-sm">
                                  <div className="flex space-x-4 mb-2"><div className="w-4 h-4 bg-white rounded-full"></div><div className="w-4 h-4 bg-white rounded-full"></div></div>
                                  <div className="w-8 h-8 border-b-4 border-white rounded-full"></div>
                              </div>
                              <h2 className="text-xl font-bold text-orange-600">쩝쩝이</h2>
                              <p className="text-sm text-gray-500">도형 놀이</p>
                          </button>
                      </div>
                  </div>
              );
          }

          if (gameState === 'menu') {
            return (
              <div className={`flex flex-col items-center justify-center h-full w-full max-w-3xl mx-auto p-6 rounded-3xl shadow-2xl my-4 relative ${currentStyle.lightBg}`}>
                {renderOverlayControls()}
                <div className="absolute top-4 left-4 md:top-6 md:left-6">
                    <button onClick={() => leaveTo('characterSelect')} className="px-3 py-1.5 md:px-4 md:py-2 bg-white rounded-full text-gray-500 font-bold hover:bg-gray-100 shadow-sm flex items-center gap-2 text-sm md:text-base">
                        <Home size={18}/> <span className="hidden md:inline">캐릭터 바꾸기</span>
                    </button>
                </div>
                <div className={`${currentStyle.shape} ${currentStyle.bg} flex flex-col items-center justify-center mb-6 animate-bounce shadow-lg transition-all transform scale-90 md:scale-100`}>
                  <div className={`flex space-x-3 mb-2`}>
                      <div className={`${currentStyle.eye}`}></div>
                      <div className={`${currentStyle.eye}`}></div>
                  </div>
                  {selectedChar === 'jeop' ? 
                    <div className="w-8 h-8 border-b-4 border-white rounded-full"></div> : 
                    <div className="w-10 h-4 bg-black/20 rounded-b-full"></div>
                  }
                </div>
                <h1 className="text-3xl md:text-5xl font-extrabold text-gray-800 mb-4 tracking-tight text-center">
                    {selectedChar === 'nyam' ? <>글자 괴물 <span className={currentStyle.text}>냠냠이</span></> : 
                     selectedChar === 'nyom' ? <>숫자 슬라임 <span className={currentStyle.text}>뇸뇸이</span></> :
                     <>변신 괴물 <span className={currentStyle.text}>쩝쩝이</span></>}
                </h1>
                <p className="text-base md:text-lg text-gray-600 mb-8 font-medium text-center">
                    {selectedChar === 'nyam' ? "단어를 먹고 무럭무럭 자라나요!" : 
                     selectedChar === 'nyom' ? "숫자를 먹으면 쑥쑥 커져요!" : 
                     "도형을 먹으면 멋지게 변신해요!"}
                </p>
                <button 
                  onClick={() => setGameState('levelSelect')}
                  className={`px-8 py-4 md:px-10 md:py-5 ${currentStyle.bg} text-white rounded-full font-bold text-xl md:text-2xl hover:brightness-90 transition-all shadow-xl active:scale-95 flex items-center space-x-2`}
                >
                  <Play fill="currentColor" />
                  <span>놀이 시작!</span>
                </button>
              </div>
            );
          }

          if (gameState === 'levelSelect') {
            return (
                <div className={`flex flex-col items-center justify-center h-full w-full max-w-3xl mx-auto p-6 rounded-3xl shadow-2xl my-4 ${currentStyle.lightBg}`}>
                    {renderOverlayControls()}
                    <h2 className="text-2xl md:text-3xl font-extrabold text-gray-800 mb-6 text-center">몇 단계부터 시작할까요?</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 w-full max-w-4xl">
                        {[1, 2, 3].map((lv) => (
                            <button 
                                key={lv}
                                onClick={() => startGame(lv)}
                                className={`flex flex-row md:flex-col items-center p-4 md:p-6 bg-white rounded-3xl border-4 ${selectedChar === 'nyam' ? 'border-green-200 hover:border-green-400' : selectedChar === 'nyom' ? 'border-cyan-200 hover:border-cyan-400' : 'border-orange-200 hover:border-orange-400'} hover:bg-white/50 transition-all shadow-md active:scale-95`}
                            >
                                <div className={`${currentStyle.levels[lv-1].size} ${currentStyle.bg} ${selectedChar === 'nyom' ? 'rounded-[3rem]' : selectedChar === 'jeop' ? 'rounded-3xl' : 'rounded-full'} mr-4 md:mr-0 md:mb-4 shadow-sm flex items-center justify-center text-white font-bold text-xl opacity-80 transform scale-50 md:scale-75 origin-left md:origin-center`}>
                                    Lv.{lv}
                                </div>
                                <div className="text-left md:text-center">
                                    <span className="block text-xl font-bold text-gray-700">{lv}단계</span>
                                    <span className="text-sm text-gray-500 mt-1">{currentStyle.levels[lv-1].desc}</span>
                                </div>
                            </button>
                        ))}
                    </div>
                    <button onClick={() => setGameState('menu')} className="mt-8 px-6 py-2 bg-gray-200 rounded-full text-gray-600 font-bold hover:bg-gray-300">
                        뒤로 가기
                    </button>
                </div>
            );
          }

          if (gameState === 'digesting') {
              return (
                  <div className={`flex flex-col items-center justify-center h-full w-full max-w-3xl mx-auto p-6 rounded-3xl shadow-2xl my-4 relative overflow-hidden ${currentStyle.lightBg}`}>
                      {renderOverlayControls()}
                      
                      {/* 타이머 표시 */}
                      <div className="absolute top-6 left-6 z-30 flex items-center gap-2 bg-white/80 px-4 py-2 rounded-full shadow-sm">
                          <Timer className={timeLeft <= 10 ? 'text-red-500 animate-pulse' : 'text-gray-600'} />
                          <span className={`text-xl font-bold ${timeLeft <= 10 ? 'text-red-500' : 'text-gray-700'}`}>{timeLeft}초</span>
                      </div>

                      {/* 배경 텍스트 (방해되지 않게) */}
                      <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-0 opacity-10 text-center pointer-events-none">
                          <h2 className="text-6xl md:text-8xl font-black text-gray-800 mb-4 whitespace-nowrap">꺼억~</h2>
                          <p className="text-3xl md:text-5xl font-bold text-gray-600 whitespace-nowrap">소화시키자!</p>
                      </div>
                      
                      {/* 방울들 (z-index 높임) */}
                      <div className="z-10 w-full h-full relative">
                          {digestBubbles.map((bubble) => (
                              <button
                                  key={bubble.id}
                                  onClick={() => handlePopBubble(bubble.id)}
                                  className={`absolute rounded-full flex items-center justify-center shadow-lg cursor-pointer animate-float border-4 border-white/50 active:scale-95 hover:scale-110 transition-transform ${selectedChar === 'nyam' ? 'bg-green-400 text-white' : selectedChar === 'nyom' ? 'bg-cyan-400 text-white' : 'bg-orange-400 text-white'}`}
                                  style={{
                                      left: `${bubble.x}%`,
                                      top: `${bubble.y}%`,
                                      width: `${bubble.size}px`,
                                      height: `${bubble.size}px`,
                                      animationDuration: bubble.speed,
                                      animationDelay: bubble.delay,
                                      fontSize: '1.2rem',
                                      fontWeight: 'bold'
                                  }}
                              >
                                  {bubble.word}
                              </button>
                          ))}
                      </div>
                      
                      {digestBubbles.length === 0 && (
                          <div className="z-30 text-4xl animate-bounce font-bold text-green-600 bg-white/80 px-6 py-3 rounded-xl shadow-lg">👍 소화 완료!</div>
                      )}
                  </div>
              );
          }

          if (gameState === 'clear') {
            return (
              <div className="flex flex-col items-center justify-center h-full w-full max-w-3xl mx-auto p-6 rounded-3xl shadow-2xl my-4 text-center bg-purple-50">
                {renderOverlayControls()}
                {/* 왕관이 몬스터 위로 48px 튀어나오므로 여백을 넉넉히 둬야 겹치지 않는다 */}
                <Sparkles className="text-purple-400 w-16 h-16 mb-16 animate-spin-slow" />
                <div className={`${currentStyle.levels[2].size} ${currentStyle.bg} ${selectedChar === 'nyom' ? 'rounded-[3rem]' : selectedChar === 'jeop' ? 'rounded-3xl' : 'rounded-full'} flex flex-col items-center justify-center mb-8 shadow-2xl animate-bounce relative`}>
                  <div className="absolute -top-12 animate-pulse">
                    <Crown className="text-yellow-400 fill-yellow-400 drop-shadow-lg w-16 h-16" />
                  </div>
                  <div className="flex space-x-6 mb-4">
                      <div className={`${currentStyle.eye} rounded-full`}></div>
                      <div className={`${currentStyle.eye} rounded-full`}></div>
                  </div>
                  <div className="w-24 h-12 bg-black/20 rounded-b-full relative overflow-hidden"><div className="absolute bottom-0 w-full h-4 bg-red-400"></div></div>
                </div>
                <h2 className="text-3xl md:text-5xl font-extrabold text-purple-600 mb-6">{currentStyle.label}가 왕이 되었어요!</h2>
                <p className="text-xl text-gray-500 mb-8 font-bold">참 잘했어요! 멋진 박사님!</p>
                <div className="flex gap-4">
                    <button onClick={() => leaveTo('menu')} className="flex items-center space-x-2 px-6 py-3 bg-gray-800 text-white rounded-full font-bold text-lg hover:bg-gray-700 transition-colors shadow-lg active:scale-95">
                      <RotateCcw size={20} /> <span>다시 키우기</span>
                    </button>
                    <button onClick={() => leaveTo('characterSelect')} className="flex items-center space-x-2 px-6 py-3 bg-white text-gray-800 border-2 border-gray-200 rounded-full font-bold text-lg hover:bg-gray-50 transition-colors shadow-lg active:scale-95">
                      <Home size={20} /> <span>다른 친구</span>
                    </button>
                </div>
              </div>
            );
          }

          const currentData = currentPool[currentIdx];
          const displayPrompt = currentData ? (currentData.display || currentData.prompt) : "";

          // 몸 색은 딱 하나만 붙인다. 예전처럼 bg 클래스를 여러 개 겹쳐 두면
          // 어떤 색이 이기는지가 Tailwind의 CSS 출력 순서에 달려 있어 들쭉날쭉했다.
          const monsterBg =
              monsterState === 'sad'     ? 'bg-gray-400'
            : monsterState === 'levelup' ? 'bg-yellow-300'
            : (selectedChar === 'jeop' && jeopShape) ? jeopShape.bg
            : currentStyle.bg;
          const progressPercent = (exp / maxExpPerLevel) * 100;

          // 5. 게임 플레이 화면 (반응형 텍스트 크기 적용)
          return (
            <div className={`flex flex-col h-full w-full max-w-4xl mx-auto p-4 md:p-6 rounded-3xl shadow-2xl my-auto relative overflow-hidden justify-between ${currentStyle.lightBg}`}>
              <div className="flex justify-between items-center bg-white p-4 md:p-6 rounded-3xl shadow-md z-10 w-full mb-4">
                <div className="flex flex-col w-full min-w-0 mr-2 md:mr-6">
                  <div className="flex justify-between items-end gap-2 mb-2">
                    <span className="text-sm md:text-xl font-bold text-gray-600 whitespace-nowrap truncate">{currentStyle.label} (Lv.{level})</span>
                    <span className="text-sm md:text-lg font-bold text-gray-500 whitespace-nowrap flex-shrink-0">{exp} / {maxExpPerLevel}</span>
                  </div>
                  <div className="w-full h-4 bg-gray-200 rounded-full overflow-hidden">
                    <div className={`h-full ${selectedChar === 'nyam' ? 'bg-green-400' : selectedChar === 'nyom' ? 'bg-cyan-400' : 'bg-orange-400'} transition-all duration-500 ease-out`} style={{ width: `${progressPercent}%` }} />
                  </div>
                </div>
                <div className="flex gap-1 md:gap-2 items-center">
                    {renderAudioButtons(20)}
                    <button onClick={resetLevel} className="p-2 md:p-3 bg-gray-100 rounded-full hover:bg-gray-200 flex-shrink-0" title="이 단계 다시 시작">
                        <Refresh className="text-gray-600" size={20} />
                    </button>
                    <button onClick={() => leaveTo('menu')} className="p-2 md:p-3 bg-gray-100 rounded-full hover:bg-gray-200 flex-shrink-0" title="처음 화면으로">
                      <Home className="text-gray-600" size={20} />
                    </button>
                </div>
              </div>

              {renderDebugPanel()}

              {notice && (
                <div className="absolute inset-0 z-40 flex items-center justify-center pointer-events-none px-6">
                  <div className={`bg-white/95 backdrop-blur-sm border-4 rounded-3xl px-8 py-6 shadow-2xl text-center animate-bounce ${notice.tone === 'hint' ? 'border-sky-200' : 'border-red-200'}`}>
                    <div className="text-6xl md:text-7xl mb-3">{notice.emoji}</div>
                    <p className={`text-xl md:text-3xl font-extrabold whitespace-pre-line break-keep ${notice.tone === 'hint' ? 'text-sky-600' : 'text-red-500'}`}>{notice.text}</p>
                  </div>
                </div>
              )}

              {!currentData ? <div className="flex-1 flex items-center justify-center text-xl font-bold text-gray-500">문제를 불러오는 중...</div> :
              <>
                <div className="flex-1 flex flex-col items-center justify-center w-full relative min-h-0">
                    <div 
                    onClick={() => speakWord(currentData.prompt)}
                    className={`
                        cursor-pointer active:scale-95
                        mb-6 bg-white px-6 py-4 md:px-8 md:py-6 rounded-3xl rounded-br-none shadow-lg border-4 border-gray-100 
                        transition-all duration-300 ${selectedChar === 'nyam' ? 'hover:border-green-300' : selectedChar === 'nyom' ? 'hover:border-cyan-300' : 'hover:border-orange-300'} hover:shadow-xl group
                        ${monsterState === 'levelup' ? 'opacity-0' : 'opacity-100'}
                    `}
                    >
                    <div className="flex items-center justify-center space-x-3">
                        <p className="text-2xl md:text-4xl font-bold text-gray-800 text-center break-keep">
                        {monsterState === 'happy' ? (selectedChar === 'nyam' ? "우와! 꿀맛이야!" : selectedChar === 'nyom' ? "냠냠! 숫자 맛있어!" : "쩝쩝! 모양이 재밌어!") : displayPrompt}
                        </p>
                        {monsterState !== 'happy' && (
                        <Volume2 className={`text-gray-400 ${selectedChar === 'nyam' ? 'group-hover:text-green-500' : selectedChar === 'nyom' ? 'group-hover:text-cyan-500' : 'group-hover:text-orange-500'} transition-colors`} size={28} />
                        )}
                    </div>
                    </div>

                    <div className={`
                    relative transition-all duration-700 ease-in-out flex flex-col items-center justify-center shadow-xl transform scale-100 md:scale-125
                    ${currentStyle.levels[level-1].size} ${monsterBg}
                    ${selectedChar === 'nyom' ? 'rounded-[3rem] animate-jelly' : selectedChar === 'jeop' ? jeopShapeClass(jeopShape) : 'rounded-full'}
                    ${monsterState === 'sad' ? 'animate-shake' : ''}
                    ${monsterState === 'happy' ? 'animate-bounce' : ''}
                    ${monsterState === 'levelup' ? 'animate-levelup' : ''}
                    `}
                    style={selectedChar === 'jeop' ? jeopClipStyle(jeopShape) : {}}
                    >
                    {level === 3 && monsterState === 'happy' && (
                        <div className="absolute -top-10 animate-bounce transition-opacity duration-500">
                        <Crown className="text-yellow-400 fill-yellow-400 drop-shadow-md w-12 h-12" />
                        </div>
                    )}
                    <div className={`flex transition-all duration-300 ${level === 1 ? 'space-x-3' : level === 2 ? 'space-x-5' : 'space-x-8'} mb-2`}>
                        {monsterState === 'happy' ? (
                        <><div className="text-gray-800 font-bold text-2xl md:text-4xl">^</div><div className="text-gray-800 font-bold text-2xl md:text-4xl">^</div></>
                        ) : monsterState === 'sad' ? (
                        <><div className="text-gray-800 font-bold text-2xl md:text-4xl">{'>'}</div><div className="text-gray-800 font-bold text-2xl md:text-4xl">{'<'}</div></>
                        ) : (
                        <><div className={`${currentStyle.eye}`}></div><div className={`${currentStyle.eye}`}></div></>
                        )}
                    </div>
                    <div className={`
                        bg-black/20 transition-all duration-300 flex items-center justify-center overflow-hidden relative
                        ${monsterState === 'idle' ? (selectedChar === 'jeop' ? 'w-8 h-8 border-b-4 border-white rounded-full' : 'w-1/3 h-2 rounded-full mt-2') : ''}
                        ${monsterState === 'eating' ? 'w-1/2 h-1/2 rounded-full animate-chomp' : ''}
                        ${monsterState === 'happy' ? 'w-1/2 h-1/3 rounded-b-full mt-1' : ''}
                        ${monsterState === 'sad' ? 'w-1/3 h-2 rounded-t-full mt-4' : ''}
                        ${monsterState === 'levelup' ? 'w-1/2 h-1/3 rounded-b-full mt-1' : ''}
                    `}>
                        {monsterState === 'eating' && swallowedWord && (
                        <span className="text-white font-bold text-xl md:text-3xl absolute animate-ping">{swallowedWord.substring(0, 3)}</span>
                        )}
                        {(monsterState === 'happy' || monsterState === 'levelup') && (
                        <div className="absolute bottom-0 w-3/4 h-1/2 bg-red-400 rounded-t-full"></div>
                        )}
                    </div>
                    {monsterState === 'happy' && <Heart className="absolute -top-6 -right-4 text-red-500 fill-red-500 animate-bounce w-8 h-8" />}
                    </div>
                </div>

                <div className={`w-full grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-6 mt-4 md:mt-6 transition-opacity duration-300 ${(monsterState === 'eating' || monsterState === 'levelup') ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
                    {currentData && currentData.options.map((word, index) => {
                    const isWrong = wrongWord === word;
                    const textSizeClass = selectedChar === 'nyam' 
                        ? 'text-xl md:text-3xl lg:text-4xl break-keep leading-snug'
                        : 'text-2xl md:text-4xl lg:text-5xl';
                    
                    return (
                        <button
                        key={`${currentIdx}-${index}`}
                        onClick={() => handleFeed(word)}
                        disabled={monsterState !== 'idle' && monsterState !== 'sad'}
                        className={`
                            relative p-4 md:p-6 rounded-2xl md:rounded-3xl font-bold shadow-md transition-all duration-300 flex items-center justify-center min-h-[70px] md:min-h-[100px]
                            bg-white text-gray-700 border-b-4 md:border-b-8 border-gray-200
                            hover:scale-105 active:border-b-0 active:translate-y-2
                            ${textSizeClass}
                            ${selectedChar === 'nyam' ? 'hover:bg-green-50' : selectedChar === 'nyom' ? 'hover:bg-cyan-50' : 'hover:bg-orange-50'}
                            ${isWrong ? 'bg-red-100 text-red-500 border-red-300 animate-shake' : ''}
                        `}
                        >
                        {word}
                        </button>
                    );
                    })}
                </div>
              </>
              }
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WordTamagotchi />);
    </script>
</body>
</html>
